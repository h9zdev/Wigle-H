name: Android CI

on:
  push:
    branches: [ "main", "master", "foss-main" ]
  pull_request:
    branches: [ "main", "master", "foss-main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create local.properties
        run: |
          MAPS_KEY="${{ secrets.MAPS_API_KEY }}"
          if [ -z "$MAPS_KEY" ]; then
            MAPS_KEY="DEFAULT"
          fi
          echo "MAPS_API_KEY=$MAPS_KEY" > local.properties

      - name: Run unit tests
        run: ./gradlew test

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wiglewifiwardriving-debug
          path: wiglewifiwardriving/build/outputs/apk/debug/wiglewifiwardriving-debug.apk
